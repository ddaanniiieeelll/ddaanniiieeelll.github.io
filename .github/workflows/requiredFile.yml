name: require specific file

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  check-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check for specific file
        run: |
          if ! git diff --name-only origin/release...HEAD | grep -q "CNAME"; then
            echo "Error: CNAME is missing from this PR."
            exit 1
          fi
